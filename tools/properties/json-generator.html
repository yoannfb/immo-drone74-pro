<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur JSON - Immo-Drone74</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #1a5f7a;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .form-section {
            margin-bottom: 2.5rem;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #3182ce;
        }

        .form-section h2 {
            color: #1e293b;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Style pour les listes dynamiques */
        .dynamic-list {
            margin-top: 1rem;
        }

        .dynamic-item {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            align-items: center;
        }

        .dynamic-item input {
            flex: 1;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn-add {
            background: #10b981;
            color: white;
            margin-top: 0.5rem;
        }

        .btn-add:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-remove {
            background: #ef4444;
            color: white;
            padding: 0.5rem 1rem;
        }

        .btn-remove:hover {
            background: #dc2626;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 2rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        /* Section vidéos */
        .video-section {
            background: #f0f9ff;
            border-left-color: #0ea5e9;
        }

        .video-item {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 2px solid #e0e7ff;
        }

        .video-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .video-number {
            font-weight: 700;
            color: #0ea5e9;
            font-size: 1.1rem;
        }

        .output-section {
            margin-top: 3rem;
            padding: 2rem;
            background: #1e293b;
            border-radius: 12px;
        }

        .output-section h2 {
            color: #f1f5f9;
            margin-bottom: 1rem;
        }

        #output {
            background: #0f172a;
            color: #94a3b8;
            padding: 1.5rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 500px;
            overflow-y: auto;
        }

        .copy-btn {
            background: #10b981;
            color: white;
            margin-top: 1rem;
            width: auto;
        }

        .copy-btn:hover {
            background: #059669;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Générateur JSON</h1>
        <p class="subtitle">Immo-Drone74 - Configuration des mini-sites</p>

        <form id="propertyForm">
            <!-- Section Informations principales -->
            <div class="form-section">
                <h2>📋 Informations principales</h2>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label for="title">Titre du bien *</label>
                        <input type="text" id="title" required placeholder="Ex: Villa Moderne avec Piscine">
                    </div>
                    
                    <div class="form-group">
                        <label for="location">Localisation *</label>
                        <input type="text" id="location" required placeholder="Ex: 74330 La Balme de Sillingy">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="price">Prix *</label>
                        <input type="text" id="price" required placeholder="Ex: 750 000€">
                    </div>
                    
                    <div class="form-group">
                        <label for="reference">Référence</label>
                        <input type="text" id="reference" placeholder="Ex: Demo 2026">
                    </div>
                </div>
            </div>

            <!-- Section Médias -->
            <div class="form-section">
                <h2>📸 Médias</h2>
                
                <div class="form-group">
                    <label for="heroImage">Image principale (URL Imgur) *</label>
                    <input type="url" id="heroImage" required placeholder="https://i.imgur.com/xxxxx.jpg">
                </div>

                <!-- NOUVEAU : Section Vidéos multiples -->
                <div class="form-group">
                    <label>🎥 Vidéos YouTube</label>
                    <div id="videoList" class="dynamic-list"></div>
                    <button type="button" class="btn btn-add" onclick="addVideo()">+ Ajouter une vidéo</button>
                </div>

                <div class="form-group">
                    <label>Galerie photos (URLs Imgur)</label>
                    <div id="galleryList" class="dynamic-list"></div>
                    <button type="button" class="btn btn-add" onclick="addGalleryImage()">+ Ajouter une photo</button>
                </div>
            </div>

            <!-- Section Caractéristiques -->
            <div class="form-section">
                <h2>✨ Caractéristiques</h2>
                <div id="featuresList" class="dynamic-list"></div>
                <button type="button" class="btn btn-add" onclick="addFeature()">+ Ajouter une caractéristique</button>
            </div>

            <!-- Section Description -->
            <div class="form-section">
                <h2>📝 Description</h2>
                
                <div class="form-group">
                    <label for="descIntro">Introduction</label>
                    <textarea id="descIntro" placeholder="Courte introduction accrocheuse..."></textarea>
                </div>

                <div class="form-group">
                    <label>Paragraphes de description</label>
                    <div id="paragraphsList" class="dynamic-list"></div>
                    <button type="button" class="btn btn-add" onclick="addParagraph()">+ Ajouter un paragraphe</button>
                </div>

                <div class="form-group">
                    <label>Points forts</label>
                    <div id="highlightsList" class="dynamic-list"></div>
                    <button type="button" class="btn btn-add" onclick="addHighlight()">+ Ajouter un point fort</button>
                </div>
            </div>

            <!-- Section Équipements -->
            <div class="form-section">
                <h2>🔧 Équipements</h2>
                <div id="amenitiesList" class="dynamic-list"></div>
                <button type="button" class="btn btn-add" onclick="addAmenity()">+ Ajouter un équipement</button>
            </div>

            <!-- Section Carte -->
            <div class="form-section">
                <h2>🗺️ Localisation</h2>
                <div class="form-group">
                    <label for="mapUrl">URL Google Maps (iframe embed)</label>
                    <input type="url" id="mapUrl" placeholder="https://www.google.com/maps/embed?pb=...">
                </div>
            </div>

            <!-- Section Proximités -->
            <div class="form-section">
                <h2>📍 Proximités</h2>
                <div id="proximityList" class="dynamic-list"></div>
                <button type="button" class="btn btn-add" onclick="addProximity()">+ Ajouter une proximité</button>
            </div>

            <!-- Section Contact -->
            <div class="form-section">
                <h2>📞 Informations de contact</h2>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label for="agencyName">Nom</label>
                        <input type="text" id="agencyName" value="Yoann Favre-Bonvin">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Téléphone</label>
                        <input type="tel" id="phone" value="+33613324923">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" value="yoannfb@hotmail.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="whatsapp">WhatsApp</label>
                        <input type="tel" id="whatsapp" value="33613324923">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">🚀 Générer le JSON</button>
        </form>

        <!-- Section Output -->
        <div class="output-section" id="outputSection" style="display: none;">
            <h2>📋 JSON Généré</h2>
            <div id="output"></div>
            <button class="btn copy-btn" onclick="copyToClipboard()">📋 Copier le JSON</button>
        </div>
    </div>

    <script>
        // Compteurs pour les IDs
        let videoCount = 0;
        let galleryCount = 0;
        let featureCount = 0;
        let paragraphCount = 0;
        let highlightCount = 0;
        let amenityCount = 0;
        let proximityCount = 0;

        // NOUVEAU : Fonction pour ajouter une vidéo
        function addVideo() {
            const id = videoCount++;
            const html = `
                <div class="video-item" id="video_${id}">
                    <div class="video-item-header">
                        <span class="video-number">Vidéo ${id + 1}</span>
                        <button type="button" class="btn btn-remove" onclick="removeElement('video_${id}')">✕ Supprimer</button>
                    </div>
                    <div class="form-group">
                        <label>URL YouTube (embed)</label>
                        <input type="url" class="video-url" placeholder="https://www.youtube.com/embed/xxxxx" />
                    </div>
                    <div class="form-group">
                        <label>Titre de la vidéo</label>
                        <input type="text" class="video-title" placeholder="Ex: Vue aérienne de la propriété" />
                    </div>
                </div>
            `;
            document.getElementById('videoList').insertAdjacentHTML('beforeend', html);
        }

        function addGalleryImage() {
            const id = galleryCount++;
            const html = `
                <div class="dynamic-item" id="gallery_${id}">
                    <input type="url" class="gallery-url" placeholder="https://i.imgur.com/xxxxx.jpg" />
                    <input type="text" class="gallery-alt" placeholder="Légende de la photo" />
                    <button type="button" class="btn btn-remove" onclick="removeElement('gallery_${id}')">✕</button>
                </div>
            `;
            document.getElementById('galleryList').insertAdjacentHTML('beforeend', html);
        }

        function addFeature() {
            const id = featureCount++;
            const html = `
                <div class="dynamic-item" id="feature_${id}">
                    <input type="text" class="feature-value" placeholder="Valeur (ex: 100)" />
                    <input type="text" class="feature-label" placeholder="Label (ex: m² terrasse)" />
                    <button type="button" class="btn btn-remove" onclick="removeElement('feature_${id}')">✕</button>
                </div>
            `;
            document.getElementById('featuresList').insertAdjacentHTML('beforeend', html);
        }

        function addParagraph() {
            const id = paragraphCount++;
            const html = `
                <div class="dynamic-item" id="paragraph_${id}">
                    <textarea class="description-paragraph" placeholder="Paragraphe de description..." style="flex: 1; min-height: 80px;"></textarea>
                    <button type="button" class="btn btn-remove" onclick="removeElement('paragraph_${id}')">✕</button>
                </div>
            `;
            document.getElementById('paragraphsList').insertAdjacentHTML('beforeend', html);
        }

        function addHighlight() {
            const id = highlightCount++;
            const html = `
                <div class="dynamic-item" id="highlight_${id}">
                    <input type="text" class="highlight-text" placeholder="Point fort (ex: Emplacement privilégié)" />
                    <button type="button" class="btn btn-remove" onclick="removeElement('highlight_${id}')">✕</button>
                </div>
            `;
            document.getElementById('highlightsList').insertAdjacentHTML('beforeend', html);
        }

        function addAmenity() {
            const id = amenityCount++;
            const html = `
                <div class="dynamic-item" id="amenity_${id}">
                    <input type="text" class="amenity-text" placeholder="Équipement (ex: Cuisine équipée)" />
                    <button type="button" class="btn btn-remove" onclick="removeElement('amenity_${id}')">✕</button>
                </div>
            `;
            document.getElementById('amenitiesList').insertAdjacentHTML('beforeend', html);
        }

        function addProximity() {
            const id = proximityCount++;
            const html = `
                <div class="dynamic-item" id="proximity_${id}">
                    <input type="text" class="proximity-label" placeholder="Lieu (ex: École Primaire)" />
                    <input type="text" class="proximity-distance" placeholder="Distance (ex: 5 min)" />
                    <button type="button" class="btn btn-remove" onclick="removeElement('proximity_${id}')">✕</button>
                </div>
            `;
            document.getElementById('proximityList').insertAdjacentHTML('beforeend', html);
        }

        function removeElement(id) {
            document.getElementById(id).remove();
        }

        // Initialiser avec des champs par défaut
        window.onload = function() {
            addVideo();
            addGalleryImage();
            addGalleryImage();
            addGalleryImage();
            addFeature();
            addFeature();
            addParagraph();
            addHighlight();
            addHighlight();
            addHighlight();
            addAmenity();
            addAmenity();
            addProximity();
            addProximity();
        };

        // Soumission du formulaire
        document.getElementById('propertyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Récupérer les vidéos
            const videos = Array.from(document.querySelectorAll('.video-item')).map(item => {
                const url = item.querySelector('.video-url').value.trim();
                const title = item.querySelector('.video-title').value.trim();
                return url ? { url, title: title || 'Vidéo' } : null;
            }).filter(v => v !== null);

            // Récupérer la galerie
            const gallery = Array.from(document.querySelectorAll('.gallery-url')).map((input, i) => {
                const url = input.value.trim();
                const alt = document.querySelectorAll('.gallery-alt')[i].value.trim();
                return url ? { url, alt } : null;
            }).filter(g => g !== null);

            // Récupérer les features
            const features = Array.from(document.querySelectorAll('.feature-value')).map((input, i) => {
                const value = input.value.trim();
                const label = document.querySelectorAll('.feature-label')[i].value.trim();
                return value && label ? { value, label } : null;
            }).filter(f => f !== null);

            // Récupérer les paragraphes
            const paragraphs = Array.from(document.querySelectorAll('.description-paragraph'))
                .map(ta => ta.value.trim())
                .filter(p => p);

            // Récupérer les highlights
            const highlights = Array.from(document.querySelectorAll('.highlight-text'))
                .map(input => input.value.trim())
                .filter(h => h);

            // Récupérer les équipements
            const amenities = Array.from(document.querySelectorAll('.amenity-text'))
                .map(input => input.value.trim())
                .filter(a => a);

            // Récupérer les proximités
            const proximity = Array.from(document.querySelectorAll('.proximity-label')).map((input, i) => {
                const label = input.value.trim();
                const distance = document.querySelectorAll('.proximity-distance')[i].value.trim();
                return label && distance ? { label, distance } : null;
            }).filter(p => p !== null);

            // Construire l'objet JSON
            const json = {
                property: {
                    title: document.getElementById('title').value,
                    location: document.getElementById('location').value,
                    price: document.getElementById('price').value,
                    reference: document.getElementById('reference').value || ''
                },
                media: {
                    heroImage: document.getElementById('heroImage').value,
                    videos: videos, // NOUVEAU : Array de vidéos
                    gallery: gallery
                },
                features: features,
                description: {
                    intro: document.getElementById('descIntro').value,
                    paragraphs: paragraphs,
                    highlights: highlights
                },
                amenities: amenities,
                location: {
                    mapUrl: document.getElementById('mapUrl').value
                },
                proximity: {
                    items: proximity
                },
                agency: {
                    name: document.getElementById('agencyName').value,
                    phone: document.getElementById('phone').value,
                    email: document.getElementById('email').value,
                    whatsapp: document.getElementById('whatsapp').value,
                    primaryColor: "#1a5f7a",
                    accentColor: "#64ffda"
                }
            };

            // Afficher le JSON
            const output = JSON.stringify(json, null, 2);
            document.getElementById('output').textContent = output;
            document.getElementById('outputSection').style.display = 'block';
            document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
        });

        function copyToClipboard() {
            const output = document.getElementById('output').textContent;
            navigator.clipboard.writeText(output).then(() => {
                alert('✅ JSON copié dans le presse-papiers !');
            });
        }
    </script>
</body>
</html>
